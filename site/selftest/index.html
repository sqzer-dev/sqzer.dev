<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>sqzer: decodeAny in this browser</title>
</head>
<body>
<h1><code>decodeAny</code> in this browser</h1>
<p>What the canvas path of the <code>sqzer</code> package does here, on the page and in a worker. <code>ok</code> is as documented, <code>note</code> differs between browsers and may, <code>FAIL</code> is a defect: <a href="https://github.com/sqzer-dev/sqzer.dev/issues">report it</a> with the text below.</p>
<pre id="out" aria-live="polite"></pre>
<script type="module">
  import { run } from "./checks.js";

  const out = document.getElementById("out");
  const say = (text) => out.append(`${text}\n`);
  const failed = (who, e) => say(`FAIL   ${who}  the checks did not run: ${e?.message ?? e}`);

  await run(say).catch((e) => failed("page  ", e));
  await new Promise((done) => {
    const worker = new Worker("worker.js", { type: "module" });
    worker.onmessage = ({ data }) => (data === null ? done() : say(data));
    worker.onerror = (e) => {
      failed("worker", e);
      done();
    };
  });
  say("done");
</script>
</body>
</html>
