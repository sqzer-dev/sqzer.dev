# `geist` names Next as a peer, for its `next/font` loaders. The page takes the font files only
# (ADR-0003 D3), so the peer is optional here and Next stays out of the install.
packageExtensions:
  geist:
    peerDependenciesMeta:
      next:
        optional: true
# pnpm holds back a release younger than a day. `sqzer` is this project's own package, bumped the day it
# is published; pnpm wrote the exclusion at `pnpm install`, and it does nothing once the day has passed.
minimumReleaseAgeExclude:
  - sqzer@0.4.0
