<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Chrome on Android paints its bar in the page's own `gray 1`. Safari 26 ignores the tag: see the backdrop below -->
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <title>sqzer</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Drop an image, get a smaller one that looks the same. Runs in the browser, nothing is uploaded."
    />
    <script type="module" src="/src/app/main.tsx"></script>
  </head>
  <body>
    <!-- Safari 26 paints its status bar and tab bar in the background colour of the first fixed element it hits
         in the middle of the window's edge, and leaves them translucent over the page otherwise. The page's
         `gray 1` behind everything is what it finds where nothing else is fixed, and the strip on the top edge
         is what it finds there whatever the page shows: the width of the window, 16 px tall, all of it padding
         with the background clipped to the content, so it paints nothing, and over everything, since Safari
         takes the first element at the point. The bottom expander has its own strip, in the sheet's colour. -->
    <div class="pointer-events-none fixed inset-0 -z-10 bg-background" aria-hidden="true"></div>
    <div
      class="pointer-events-none fixed inset-x-0 top-0 z-[60] box-content h-0 bg-background bg-clip-content pb-4"
      aria-hidden="true"
    ></div>
    <div id="root"></div>
  </body>
</html>
