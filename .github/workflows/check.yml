name: Check

# The checks of ADR-0002 D6, against the version of `sqzer` that `package.json`
# names, so a Dependabot bump is tested before it merges.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # the version of pnpm is the `packageManager` of `package.json`
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm fsd
      - run: pnpm exec playwright install --with-deps chromium firefox
      # units, components and `decodeAny`, in Chromium and Firefox
      - run: pnpm test
      # the built page, served by `vite preview`, in Chromium and Firefox
      - run: pnpm test:e2e
